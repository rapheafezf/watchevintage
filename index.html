      font-weight: 600;
      text-decoration: none;

    .btn-gold {
      background: #bfa15f;
      color: #11161b;
    }
    .btn-gold:hover {
      background: #d4af37;
    }
    .btn-outline {

      border: 1px solid rgba(255, 255, 255, 0.2);
